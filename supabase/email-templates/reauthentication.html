<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tu código de verificación — BandYou</title>
</head>
<body style="margin:0;padding:0;background:#1a1714;font-family:'Helvetica Neue',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#1a1714;padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="100%" style="max-width:520px;background:#242018;border-radius:20px;border:1px solid #3a3228;overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="background:linear-gradient(135deg,#3d1a0e 0%,#242018 100%);padding:32px 40px 28px;border-bottom:1px solid #3a3228;">
              <p style="margin:0;font-size:22px;font-weight:900;color:#f5f0e8;letter-spacing:-0.5px;">
                Band<span style="color:#a0442a;">You</span>
              </p>
              <p style="margin:6px 0 0;font-size:11px;color:#8a7d6e;letter-spacing:2px;text-transform:uppercase;font-weight:600;">La red musical de España</p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:36px 40px 32px;">
              <h1 style="margin:0 0 12px;font-size:24px;font-weight:900;color:#f5f0e8;line-height:1.2;">Tu código de verificación</h1>
              <p style="margin:0 0 24px;font-size:15px;color:#a8998a;line-height:1.6;">
                Introduce este código en BandYou para confirmar que eres tú. Caduca en 1 hora.
              </p>

              <p style="margin:0 0 8px;font-size:32px;font-weight:900;letter-spacing:8px;color:#f5f0e8;">{{ .Token }}</p>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:0 40px;">
              <div style="height:1px;background:#3a3228;"></div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px 40px 32px;">
              <p style="margin:0 0 4px;font-size:11px;color:#6b5e52;">
                Si no has intentado esta acción, cambia tu contraseña.
              </p>
              <p style="margin:0;font-size:11px;color:#6b5e52;">
                © 2026 BandYou · Madrid, España ·
                <a href="https://bandyou.es/legal/privacidad" style="color:#8a7d6e;text-decoration:none;">Privacidad</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>

    <h1>BandYou: encuentra banda y músicos en España</h1>
    <p>BandYou es la red social gratuita de la comunidad musical de España. Si eres músico y buscas banda, si a tu banda le falta batería, bajista, guitarra o voz, o si buscas local de ensayo, clases de música o sala para tocar, aquí lo encuentras por provincia, instrumento y estilo, y escribes directamente a quien te interesa.</p>
    <ul>
      <li><a href="/busco-banda">Busco banda</a>: bandas que buscan músico en tu provincia.</li>
      <li><a href="/busco-musicos">Busco músicos</a>: músicos que buscan banda.</li>
      <li><a href="/feed">Se busca</a>: anuncios de bandas y músicos.</li>
      <li><a href="/locales-de-ensayo">Locales de ensayo</a>, <a href="/clases-de-musica">clases de música</a>, <a href="/salas-de-conciertos">salas de conciertos</a> y <a href="/conciertos">agenda de conciertos</a>.</li>
      <li><a href="/quedada">La quedada de BandYou</a>: cada mes se sortea la promoción de un concierto por provincia para ayudar a las bandas a darse a conocer.</li>
      <li><a href="/guias">Guías</a>: cómo encontrar banda, cómo encontrar músicos, local de ensayo, cómo conseguir bolos.</li>
    </ul>
    <p>Crear perfil, publicar anuncios y enviar mensajes es gratis. Activa JavaScript para usar todas las funciones de BandYou.</p>

@if (visible()) {
  <!-- Slim informational bar: only strictly necessary storage is used, so no
       consent choice is required (AEPD) — just a notice and a dismiss. -->
  <div class="fixed bottom-above-nav left-0 right-0 z-50 px-3 pb-3 md:px-6 md:pb-4 pointer-events-none">
    <div role="region" aria-label="Aviso de cookies"
         class="max-w-3xl mx-auto bg-dark-800 border-2 border-ink shadow-[4px_4px_0_0_#141210]
                px-4 py-2.5 flex flex-wrap sm:flex-nowrap items-center gap-x-4 gap-y-2 pointer-events-auto
                animate-slide-in">
      <p class="flex-1 min-w-[12rem] text-xs text-ink leading-snug">
        Solo usamos cookies esenciales (almacenamiento local) para tu sesión y tus preferencias. Sin publicidad ni analítica.
        <a routerLink="/legal/cookies" class="text-primary-600 font-bold underline underline-offset-2 whitespace-nowrap">Política de cookies</a>
      </p>
      <div class="flex items-center gap-2 flex-shrink-0">
        <button type="button" (click)="dismiss()" class="btn-primary text-xs px-4 min-h-[44px] py-0">
          Entendido
        </button>
      </div>
    </div>
  </div>
}

@if (visible()) {
  <!-- Slim informational bar: only strictly necessary storage is used, so no
       consent choice is required (AEPD) — just a notice and a dismiss. -->
  <div class="fixed bottom-above-nav left-0 right-0 z-50 px-2 pb-2 md:px-6 md:pb-4 pointer-events-none">
    <div role="region" aria-label="Aviso de cookies"
         class="max-w-3xl mx-auto bg-dark-800 border-2 border-ink shadow-[3px_3px_0_0_#141210]
                pl-3 pr-2 py-1.5 sm:px-4 sm:py-2.5 flex items-center gap-3 pointer-events-auto animate-slide-in">
      <p class="flex-1 min-w-0 text-[11px] sm:text-xs text-ink leading-tight">
        Solo usamos cookies esenciales (almacenamiento local), sin publicidad ni analítica.
        <a routerLink="/legal/cookies" class="text-primary-600 font-bold underline underline-offset-2 whitespace-nowrap">Más info</a>
      </p>
      <button type="button" (click)="dismiss()" class="btn-primary flex-shrink-0 text-xs px-3 sm:px-4 min-h-[44px] py-0">
        Entendido
      </button>
    </div>
  </div>
}

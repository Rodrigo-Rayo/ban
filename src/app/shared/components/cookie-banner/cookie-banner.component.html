@if (visible()) {
  <!-- Slim bar: essential-only cookies need a notice, not a modal-sized card
       that hides forms and CTAs underneath it. -->
  <div class="fixed bottom-16 md:bottom-0 left-0 right-0 z-50 px-3 pb-3 md:px-6 md:pb-4 pointer-events-none">
    <div role="region" aria-label="Aviso de cookies"
         class="max-w-3xl mx-auto bg-dark-800 border border-dark-600 rounded-xl shadow-lg shadow-black/10
                px-4 py-2.5 flex flex-wrap sm:flex-nowrap items-center gap-x-4 gap-y-2 pointer-events-auto
                animate-slide-in">
      <p class="flex-1 min-w-[12rem] text-xs text-ink-2 leading-snug">
        Solo usamos cookies esenciales para la sesión. Sin publicidad ni rastreo.
        <a routerLink="/legal/cookies" class="text-primary-500 underline-offset-2 hover:underline whitespace-nowrap">Más información</a>
      </p>
      <div class="flex items-center gap-2 flex-shrink-0">
        <button (click)="reject()"
          class="text-xs font-medium text-ink-2 hover:text-ink border border-dark-600 hover:border-ink-muted
                 rounded-full px-3.5 min-h-[32px] transition-colors">
          Rechazar
        </button>
        <button (click)="accept()" class="btn-primary text-xs px-4 min-h-[32px] py-0">
          Aceptar
        </button>
      </div>
    </div>
  </div>
}

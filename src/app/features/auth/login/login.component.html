<div class="min-h-screen bg-dark-900 pt-16 flex">

  <!-- Form panel -->
  <div class="flex-1 flex flex-col items-center justify-center px-6 py-16 relative overflow-hidden">

    <div class="w-full max-w-sm relative z-10">
      <div class="mb-8">
        <h1 class="text-5xl text-ink leading-[1.05] mb-1.5">Bienvenido de vuelta.</h1>
        <p class="text-sm text-ink-muted">
          Entra en tu cuenta.
        </p>
      </div>

      <!-- Google OAuth -->
      <button type="button" (click)="loginWithGoogle()"
        class="w-full flex items-center justify-center gap-3 btn-secondary py-3 px-4 mb-5 min-h-[48px]">
        <svg aria-hidden="true" class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span class="text-sm font-medium">Continuar con Google</span>
      </button>

      <!-- Divider -->
      <div class="flex items-center gap-3 my-5">
        <div class="flex-1 h-0.5 bg-ink"></div>
        <span class="font-mono text-[11px] text-ink font-bold uppercase tracking-wide">o con email</span>
        <div class="flex-1 h-0.5 bg-ink"></div>
      </div>

      <!-- Form -->
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <!-- Email -->
        <div>
          <label for="login-email" class="block font-mono text-[11px] font-bold text-ink mb-1.5 uppercase tracking-wide">
            Email
          </label>
          <input id="login-email" formControlName="email" type="email" placeholder="tu@email.com"
            class="input-field" [class.border-signal-red]="isInvalid('email')" autocomplete="email" required
            [attr.aria-invalid]="isInvalid('email')"
            [attr.aria-describedby]="isInvalid('email') ? 'login-email-error' : null"/>
          @if (isInvalid('email')) {
            <p id="login-email-error" class="text-xs font-bold text-signal-red mt-1.5">Introduce un email válido.</p>
          }
        </div>

        <!-- Password -->
        <div>
          <label for="login-password" class="block font-mono text-[11px] font-bold text-ink mb-1.5 uppercase tracking-wide">
            Contraseña
          </label>
          <div class="relative">
            <input id="login-password" formControlName="password" [type]="showPassword() ? 'text' : 'password'"
              placeholder="••••••••" class="input-field pr-12" [class.border-signal-red]="isInvalid('password')" autocomplete="current-password" required
              [attr.aria-invalid]="isInvalid('password')"
              [attr.aria-describedby]="isInvalid('password') ? 'login-password-error' : null"/>
            <button type="button" (click)="showPassword.set(!showPassword())"
              [attr.aria-pressed]="showPassword()" aria-label="Mostrar contraseña" aria-controls="login-password"
              class="absolute inset-y-0 right-0 flex items-center justify-center w-11 text-ink-muted hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500">
              @if (showPassword()) {
                <svg aria-hidden="true" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.58 10.58a2 2 0 002.83 2.83M9.88 5.09A9.77 9.77 0 0112 5c5 0 9 4.5 10 7a13.2 13.2 0 01-2.2 3.4M6.6 6.6C4.3 8 2.7 10.2 2 12c1 2.5 5 7 10 7 1.6 0 3.1-.4 4.4-1.1"/></svg>
              } @else {
                <svg aria-hidden="true" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2 12c1-2.5 5-7 10-7s9 4.5 10 7c-1 2.5-5 7-10 7S3 14.5 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              }
            </button>
          </div>
          @if (isInvalid('password')) {
            <p id="login-password-error" class="text-xs font-bold text-signal-red mt-1.5">{{ passwordError() }}</p>
          }
        </div>

        <!-- Forgot password -->
        <div class="flex justify-end -mt-1">
          <a routerLink="/auth/forgot-password"
             class="text-xs text-ink-muted hover:text-primary-600 transition-colors font-medium">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        @if (error()) {
          <div role="alert" aria-live="assertive" class="bg-signal-rBg border-2 border-signal-red text-signal-red px-4 py-3 text-xs font-bold flex items-center gap-2">
            <svg aria-hidden="true" class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            {{ error() }}
          </div>
        }

        <button type="submit" [disabled]="loading()"
          class="btn-primary py-3.5 w-full mt-1 text-sm disabled:opacity-40 disabled:cursor-not-allowed min-h-[50px]">
          @if (loading()) {
            <svg aria-hidden="true" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            Entrando…
          } @else {
            Entrar
          }
        </button>
      </form>

      <p class="text-center text-xs text-ink-muted mt-7">
        ¿Sin cuenta?
        <a routerLink="/auth/register"
           class="text-primary-500 hover:text-primary-600 transition-colors font-bold ml-1">
          Regístrate gratis
        </a>
      </p>
    </div>
  </div>
  <!-- Poster panel — desktop only -->
  <app-auth-poster />
</div>
